<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出租量统计</title>
    <!-- 引入 Bootstrap -->
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
</head>
<body>
<div class="page">
    <!-- 路径导航 -->
    <ol class="breadcrumb">
        <li>首页</li>
        <li class="active">出租量统计</li>
    </ol>
    <div class="container-fluid">
        <form class="form-inline">
            <div class="form-group">
                <label>年份：</label>
                <input type="text" class="form-control" id="year">
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-primary">确定</button>
            </div>
        </form>
        <div id="main" style="height: 500px"></div>
    </div>
</div>
<!-- jQuery -->
<script src="/assets/js/jquery.min.js"></script>
<!-- Echarts -->
<script src="/assets/js/echarts.js"></script>
<script type="text/javascript">
    // 基于准备好的dom，初始化echarts实例
    let myChart = echarts.init(document.getElementById('main'));

    // 指定图表的配置项和数据
    let option = {
        //标题
        title: {
            //主标题
            text: '出租量统计',
            //对齐方式
            left: 'center'
        },
        //提示框
        tooltip: {
        },
        /**
         * 柱状图和折线图它们都属于类目图(类型图),展示在一个坐标系内
         * 其中水平轴一般情况下为类目轴
         * 垂直轴为数据轴
         */
        //x轴,水平轴,类目轴
        xAxis: {
            //轴的类型.category种类
            type: 'category',
            data: ['2025年01月', '2025年02月', '2025年03月', '2025年04月', '2025年05月', '2025年06月', '2025年07月', '2025年08月', '2025年09月', '2025年10月', '2025年11月', '2025年12月']
        },
        //y轴,垂直轴,数据轴
        yAxis: {
            //数据名称
            name: '数量',
            //轴的类型.value数值
            type: 'value',
            //数值的最小值
            minInterval: 1
        },
        //绘制图形
        //series配置项的值是一个数组,数组中的每一个元素是一个对象.每个对象表示一个数据的系列
        series: [
            {
                //数据系列的名称
                name: '出租量',
                //图形的类型: pie饼图(适合展示单系统数据的百分比) bar柱状图 line折线图
                type: 'line',
                /**
                 * 图形的数据
                 * 柱状图和折线图: 数组,数组中存放是数据值(数字).
                 */
                data: [50, 32, 28, 16, 21, 49, 26, 39, 21, 38, 12, 27]
            }
        ]
    };

    // 使用刚指定的配置项和数据显示图表。
    myChart.setOption(option);
</script>
</body>
</html>
