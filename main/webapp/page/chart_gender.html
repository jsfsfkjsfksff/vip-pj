<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户性别统计</title>
    <!-- 引入 Bootstrap -->
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
<div class="page">
    <!-- 路径导航 -->
    <ol class="breadcrumb">
        <li>首页</li>
        <li class="active">客户性别统计</li>
    </ol>
    <div class="container-fluid">
        <div id="main" style="height: 550px"></div>
    </div>
</div>
<!-- jQuery 和 Bootstrap JS -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/bootstrap/js/bootstrap.min.js"></script>
<!-- Echarts -->
<script src="/assets/js/echarts.js"></script>
<script type="text/javascript">
    // 基于准备好的dom，初始化echarts实例
    let myChart = echarts.init(document.getElementById('main'));

    // 指定图表的配置项和数据
    let option = {
        //标题
        title: {
            //主标题
            text: '客户性别比例',
            //副标题
            // subtext: 'abc',
            //对齐方式
            left: 'center'
        },
        //提示框: 鼠标悬停到某个数据,数据说明
        tooltip: {
            //触发类型. 在饼图中默认值为item
            trigger: 'item',
            //内容格式化
            //占位数据: {a}系列名 {b}数据名 {c}数据值 {d}百分比
            formatter: '{a} <br/>{b} : {c} ({d}%)'
        },
        //图例: 对扇形区域的说明
        legend: {
            //排列方式
            orient: 'vertical',
            //对齐方式
            left: 'left'
        },
        //绘制图形
        //series配置项的值是一个数组,数组中的每一个元素是一个对象.每个对象表示一个数据的系列
        series: [
            {
                //数据系列的名称
                name: '客户性别',
                //图形的类型: pie饼图(适合展示单系统数据的百分比) bar柱状图 line折线图
                type: 'pie',
                //图形的大小
                radius: '60%',
                /**
                 * 图形的数据
                 * 饼图的数据格式: 数组,数组中存放是对象.
                 *      对象有两个属性: name属性表示饼图中某个扇形区域的名称,value 属性表示饼图中某个扇形区域的值
                 */
                //本地数据
                data: [
                  {name: '男性', value: 1048},
                  {name: '女性', value: 735},
                  {name: '保密', value: 560}
                ],
                //饼图扇形区域的阴影特效.当鼠标选中此区域后,此区域会出现阴影特效使图像更加立体
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }
        ]
    };

    // 使用刚指定的配置项和数据显示图表。
    myChart.setOption(option);
</script>
</body>
</html>
